[project]
name = "beli-tool"
dynamic = ["version"]  # read from beli_tool.__version__, bump it there only
requires-python = ">=3.11"
dependencies = [
  "osxphotos>=0.68",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "Pillow>=12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "playwright>=1.50", "pip-audit>=2.9", "pyinstaller>=6.0"]

[project.scripts]
beli-tool = "beli_tool.cli:main"

[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "beli_tool.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
beli_tool = ["templates/*.html", "static/*.js", "static/*.css"]
