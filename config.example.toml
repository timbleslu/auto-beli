# Copies of photo locations are sent to OpenStreetMap matching services.
provider = "osm"
photos_only = true
max_visits = 3
# Change both dates to the short range you want to review (up to 31 days).
since = "2026-11-01"
until = "2026-11-05"
# Default runtime data lives in ~/Library/Application Support/beli-tool/.
# db_path = "/your/private/folder/ledger.sqlite"
# Optional legacy sources: photos_only = false, saved_dir = "/path/to/csvs"
# Optional provider: provider = "google", google_places_api_key = "..."
