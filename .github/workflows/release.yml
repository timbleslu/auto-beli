name: Test and build unsigned review artifact
# No automatic publication of unsigned applications.
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.15'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.5'
      - name: Locked environment
        run: uv sync --locked --extra dev
      - name: Synthetic tests
        run: uv run --locked pytest -q --ignore=tests/test_browser.py
      - name: Browser regression
        run: |
          uv run --locked playwright install chromium
          uv run --locked pytest -q tests/test_browser.py
      - name: Resolved Python dependency audit
        run: |
          uv export --locked --extra dev --no-emit-project --format requirements-txt -o /tmp/audit.txt > /dev/null
          uv run --locked pip-audit --disable-pip --require-hashes -r /tmp/audit.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26.7.0'
      - name: Audited local phone tooling (synthetic socket test only)
        working-directory: device-tools
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=low
          npm test
      - name: Build unsigned application
        run: uv run --locked pyinstaller beli-tool.spec --noconfirm
      - name: Package review artifact
        run: ditto -c -k --keepParent "dist/Beli Staging.app" Beli-Staging-UNSIGNED.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Beli-Staging-UNSIGNED
          path: Beli-Staging-UNSIGNED.zip
